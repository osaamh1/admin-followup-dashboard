<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وحدة المتابعة الإدارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // يضمن جلب أحدث نسخة من الصفحة دائمًا، بغض النظر عن أي تخزين مؤقت بالخوادم
  (function(){
    var params = new URLSearchParams(location.search);
    if(!params.has('_v')){
      params.set('_v', Date.now());
      location.replace(location.pathname + '?' + params.toString() + location.hash);
    }
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ============================================
     إعدادات الاتصال بـ Supabase — عدّل القيمتين هنا
     ============================================ */
  /* سيتم حقن القيم عبر جافاسكربت بالأسفل */

  :root{
    --ink:#1C2321;
    --ink-soft:#4A524E;
    --paper:#EEEEE5;
    --paper-raised:#F7F7F1;
    --line:#D7D3C5;
    --seal:#1B3B6F;
    --seal-dark:#12294F;
    --seal-tint:#E7ECF3;
    --teal:#1C9E93;
    --teal-tint:#DEF3F1;
    --amber:#9C6B1E;
    --amber-tint:#F1E7D3;
    --rust:#D9822B;
    --rust-tint:#FBE8D2;
    --redd:#C0392B;
    --redd-tint:#F7DCD8;
    --green:#2D6A4C;
    --green-tint:#DEEAE2;
    --radius:3px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    line-height:1.6;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Noto Kufi Arabic', sans-serif;
    margin:0;
  }
  button{font-family:inherit;cursor:pointer;}
  select,input,textarea{font-family:inherit;}

  .page{max-width:1180px;margin:0 auto;padding:28px 24px 60px;}

  /* ===== الترويسة ===== */
  .masthead{
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:3px solid var(--teal);
    padding-bottom:18px;margin-bottom:22px;
    gap:16px;flex-wrap:wrap;
  }
  .mast-right{display:flex;align-items:center;gap:16px;}
  .seal-badge{
    width:56px;height:56px;border-radius:50%;
    background:var(--seal);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Kufi Arabic', sans-serif;
    font-weight:700;font-size:15px;
    border:2px solid var(--seal-dark);
    flex-shrink:0;
  }
  .brand-logo{height:56px;width:auto;flex-shrink:0;}
  .login-logo{height:72px;width:auto;margin:0 auto 32px;display:block;}
  .masthead h1{font-size:26px;font-weight:900;color:var(--seal-dark);}
  .mast-sub{margin:4px 0 0;color:var(--ink-soft);font-size:14px;}
  .mast-left{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .mast-center{display:flex;align-items:center;gap:10px;}
  .mast-controls{display:flex;align-items:center;gap:10px;}
  .mast-date{font-size:13px;color:var(--ink-soft);}

  .btn-ghost{
    background:transparent;border:1px solid var(--ink-soft);color:var(--ink-soft);
    padding:7px 14px;border-radius:var(--radius);font-size:13px;
  }
  .btn-ghost:hover{border-color:var(--seal);color:var(--seal-dark);}
  .btn-primary{
    background:var(--seal);color:#fff;border:none;
    padding:9px 16px;border-radius:var(--radius);font-size:14px;font-weight:600;
  }
  .btn-primary:hover{background:var(--seal-dark);}
  .btn-add-task{
    font-size:15px;padding:11px 20px;font-weight:700;
    box-shadow:0 2px 6px rgba(27,59,111,0.25);
  }
  .btn-text{background:none;border:none;color:var(--seal-dark);font-size:13px;text-decoration:underline;padding:0;}

  /* ===== تنبيه ===== */
  .alert-banner{
    background:var(--redd-tint);border-right:4px solid var(--redd);
    color:var(--redd);padding:12px 16px;border-radius:var(--radius);
    margin-bottom:20px;font-size:14px;
  }
  .alert-banner strong{font-family:'Noto Kufi Arabic',sans-serif;}
  .hidden{display:none !important;}

  /* ===== شريط المؤشرات ===== */
  .stat-strip{
    display:flex;background:var(--paper-raised);
    border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:24px;overflow:hidden;
  }
  .stat{
    flex:1;text-align:center;padding:16px 8px;
    border-left:1px solid var(--line);
  }
  .stat:last-child{border-left:none;}
  .stat-num{
    display:block;font-family:'Noto Kufi Arabic',sans-serif;
    font-size:28px;font-weight:700;color:var(--seal-dark);
  }
  .stat-label{font-size:13px;color:var(--ink-soft);}
  .stat.is-late .stat-num{color:var(--rust);}
  .stat.is-stuck .stat-num{color:var(--redd);}
  .stat.is-review .stat-num{color:var(--teal);}
  .stat.is-done .stat-num{color:var(--green);}

  /* ===== التخطيط الرئيسي ===== */
  .layout{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start;}
  @media(max-width:860px){.layout{grid-template-columns:1fr;}}

  .panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);}
  .panel-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 18px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap;
  }
  .panel-head h2{font-size:17px;color:var(--seal-dark);}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .filters select{
    border:1px solid var(--line);border-radius:var(--radius);
    padding:6px 8px;font-size:13px;background:#fff;color:var(--ink);
  }

  /* ===== جدول المهام ===== */
  table.tasks-table{width:100%;border-collapse:collapse;font-size:14px;}
  .tasks-table th{
    text-align:right;padding:10px 14px;font-size:12px;color:var(--ink-soft);
    font-weight:600;border-bottom:1px solid var(--line);
  }
  .tasks-table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;}
  .tasks-table tr:last-child td{border-bottom:none;}
  .task-title{font-weight:600;}
  .task-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .task-link{font-size:11px;color:var(--seal-dark);margin-top:4px;}
  .edit-task-btn{
    display:inline-block;margin-top:6px;font-size:11px;color:var(--ink-soft);
    background:none;border:1px solid var(--line);border-radius:2px;padding:2px 8px;
  }
  .edit-task-btn:hover{color:var(--seal-dark);border-color:var(--seal-dark);}
  .task-attach{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap;}
  .task-attach-upload{
    font-size:11px;color:var(--ink-soft);cursor:pointer;
    border:1px dashed var(--line);border-radius:2px;padding:2px 8px;
  }
  .task-attach-upload:hover{color:var(--seal-dark);border-color:var(--seal-dark);}
  .review-badge{
    font-size:11px;color:var(--amber);background:var(--amber-tint);
    padding:2px 8px;border-radius:2px;font-weight:600;
  }
  .submit-approval-btn{
    font-size:11px;color:#fff;background:var(--teal);border:none;
    padding:3px 10px;border-radius:2px;font-weight:600;
  }
  .submit-approval-btn:hover{background:var(--seal-dark);}
  .approve-btn{
    font-size:11px;color:#fff;background:var(--green);border:none;
    padding:3px 10px;border-radius:2px;font-weight:600;
  }
  .approve-btn:hover{background:var(--seal-dark);}
  .date-range{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
  .date-arrow{color:var(--ink-soft);}
  .task-search{
    border:1px solid var(--line);border-radius:var(--radius);
    padding:6px 10px;font-size:13px;background:#fff;color:var(--ink);width:180px;
  }
  .tasks-table tr.row-متأخرة td:first-child{border-right:4px solid var(--rust);}
  .tasks-table tr.row-متعثرة td:first-child{border-right:4px solid var(--redd);}
  .tasks-table tr.row-منتهية td:first-child{border-right:4px solid var(--green);}
  .tasks-table tr.row-متأخرة{background:var(--rust-tint);}
  .tasks-table tr.row-متعثرة{background:var(--redd-tint);}
  .tasks-table tr.row-قيد-المراجعة{background:var(--teal-tint);}
  .empty-row td{text-align:center;color:var(--ink-soft);padding:34px;font-size:14px;}

  .badge{
    display:inline-block;padding:4px 10px;border-radius:2px;
    font-size:12px;font-weight:600;border-right:3px solid transparent;
  }
  .badge.st-جارية{background:var(--amber-tint);color:var(--amber);border-color:var(--amber);}
  .badge.st-منتهية{background:var(--green-tint);color:var(--green);border-color:var(--green);}
  .badge.st-متأخرة{background:var(--rust-tint);color:var(--rust);border-color:var(--rust);}
  .badge.st-متعثرة{background:var(--redd-tint);color:var(--redd);border-color:var(--redd);}
  .badge.st-قيد-المراجعة{background:var(--teal-tint);color:var(--seal-dark);border-color:var(--teal);}

  select.status-select{
    border:1px solid var(--line);border-radius:var(--radius);
    padding:5px 6px;font-size:12px;background:#fff;color:var(--ink);
  }

  /* ===== سجل القرارات ===== */
  .decisions-list{list-style:none;margin:0;padding:0;}
  .decisions-list li{
    padding:14px 18px;border-bottom:1px solid var(--line);
  }
  .decisions-list li:last-child{border-bottom:none;}
  .dec-title{font-weight:600;font-size:14px;}
  .dec-date{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .dec-desc{font-size:13px;color:var(--ink-soft);margin-top:6px;}

  /* ===== نافذة منبثقة ===== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(28,35,33,0.5);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal{
    background:#fff;border-radius:var(--radius);padding:24px;
    width:100%;max-width:440px;max-height:90vh;overflow-y:auto;
  }
  .modal h3{font-size:18px;color:var(--seal-dark);margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field textarea,.field select{
    width:100%;border:1px solid var(--line);border-radius:var(--radius);
    padding:8px 10px;font-size:14px;color:var(--ink);background:var(--paper);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .modal-actions:has(.btn-danger){justify-content:space-between;}
  .btn-danger{
    background:var(--redd-tint);color:var(--redd);border:1px solid var(--redd);
    padding:9px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;
  }
  .btn-danger:hover{background:var(--redd);color:#fff;}

  /* ===== شاشة الإعداد ===== */
  .setup-screen{
    max-width:560px;margin:60px auto;background:var(--paper-raised);
    border:1px solid var(--line);border-radius:var(--radius);padding:30px;
  }
  .setup-screen h2{color:var(--seal-dark);margin-bottom:12px;}
  .setup-screen p{color:var(--ink-soft);font-size:14px;}
  .setup-screen code{
    display:block;background:var(--paper);padding:10px;border-radius:var(--radius);
    font-size:13px;margin:10px 0;direction:ltr;text-align:left;
  }

  /* ===== شاشة تسجيل الدخول ===== */
  .login-screen{max-width:380px;text-align:center;}
  .login-seal{margin:0 auto 16px;}
  .login-screen h2{margin-bottom:14px;font-size:15px;color:var(--seal-dark);}
  .setup-screen p.login-unit-name{font-family:'Noto Kufi Arabic',sans-serif;font-size:24px;font-weight:700;color:var(--seal-dark);margin:0 0 16px;}
  .login-screen .field{text-align:right;}
  .login-btn{width:100%;margin-top:6px;padding:11px;font-size:15px;}
  .login-error{color:var(--redd);font-size:13px;margin-top:10px;}
  .login-error a{color:var(--seal-dark);font-weight:600;}
  .login-success{color:var(--green);font-size:13px;margin-top:10px;}
  .forgot-link{display:block;margin:14px auto 0;font-size:12px;}

  /* ===== بطاقة المستخدم بالترويسة ===== */
  .user-name{
    font-weight:700;color:#fff;font-size:19px;
    background:var(--seal-dark);
    padding:8px 20px;border-radius:var(--radius);
  }
  .user-role{
    background:var(--teal-tint);color:var(--seal-dark);
    padding:2px 9px;border-radius:2px;font-size:11px;font-weight:600;
  }
  .logout-btn{
    background:var(--redd-tint);color:var(--redd);border:1px solid var(--redd);
    padding:6px 12px;border-radius:var(--radius);font-size:13px;font-weight:600;
  }
  .logout-btn:hover{background:var(--redd);color:#fff;}

  /* ===== التقرير الأسبوعي ===== */
  .weekly-panel{margin-top:22px;}
  .completed-panel{margin-top:22px;padding:0;}
  .completed-panel summary{
    padding:14px 18px;font-family:'Noto Kufi Arabic',sans-serif;font-size:17px;
    color:var(--seal-dark);cursor:pointer;border-bottom:1px solid var(--line);
  }
  .completed-panel[open] summary{border-bottom:1px solid var(--line);}
  .completed-panel:not([open]) summary{border-bottom:none;}
  .approved-reports-panel{margin-top:22px;padding:0;}
  .approved-reports-panel summary{
    padding:14px 18px;font-family:'Noto Kufi Arabic',sans-serif;font-size:17px;
    color:var(--seal-dark);cursor:pointer;
  }
  .dept-completed-group{border-bottom:1px solid var(--line);}
  .dept-completed-group:last-child{border-bottom:none;}
  .dept-completed-group summary{
    padding:10px 18px;font-size:13px;font-weight:600;color:var(--seal-dark);
    cursor:pointer;background:var(--paper);
  }
  .badge-inline{display:inline-block;margin-right:6px;font-size:11px;padding:2px 8px;border-radius:2px;font-weight:600;}
  .badge-pending{background:var(--amber-tint);color:var(--amber);}
  .badge-approved{background:var(--green-tint);color:var(--green);}
  .approve-report-btn{
    display:inline-block;margin-top:6px;font-size:11px;color:#fff;background:var(--green);
    border:none;padding:3px 10px;border-radius:2px;font-weight:600;
  }
  .approve-report-btn:hover{background:var(--seal-dark);}
  .weekly-form textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:var(--radius);padding:10px;font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper);resize:vertical;}
  .weekly-form{padding:16px 18px;border-bottom:1px solid var(--line);}
  .weekly-date-range{display:flex;gap:12px;margin-bottom:10px;}
  .weekly-date-range .field{flex:1;margin-bottom:0;}
  .weekly-form-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .weekly-week-label{font-size:12px;color:var(--ink-soft);}
  .report-list{list-style:none;margin:0;padding:0;}
  .report-list li{padding:14px 18px;border-bottom:1px solid var(--line);}
  .report-list li:last-child{border-bottom:none;}
  .report-meta{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .report-dept{font-weight:600;color:var(--seal-dark);}
  .report-content{font-size:13px;color:var(--ink);white-space:pre-wrap;}
  .empty-note{text-align:center;color:var(--ink-soft);padding:24px;font-size:14px;}
  .attach-link{display:inline-block;margin-top:6px;font-size:12px;color:var(--seal-dark);text-decoration:underline;}

  /* ===== الرسم البياني لإنجاز الأقسام ===== */
  .dept-chart-panel{margin-bottom:22px;}
  .dept-chart{padding:18px;display:flex;flex-direction:column;gap:14px;}
  .chart-row{display:flex;align-items:center;gap:12px;}
  .chart-label{width:190px;flex-shrink:0;font-size:13px;color:var(--ink);font-weight:600;}
  .chart-bar-track{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);height:24px;overflow:hidden;}
  .chart-bar-fill{
    height:100%;background:linear-gradient(90deg, var(--seal-dark), var(--teal));
    border-radius:var(--radius);transition:width .5s ease;min-width:2px;
  }
  .chart-value{width:26px;text-align:center;font-weight:700;color:var(--seal-dark);font-size:14px;flex-shrink:0;}
</style>
</head>
<body>

<div id="app"></div>

<script>

function isConfigured(){
  return SUPABASE_URL && SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY && SUPABASE_ANON_KEY.length > 10;
}

function renderSetupScreen(){
  document.getElementById('app').innerHTML = `
    <div class="page">
      <div class="setup-screen">
        <h2>الاتصال غير مُهيّأ بعد</h2>
        <p>افتح هذا الملف بمحرر نصوص، وعدّل القيمتين التاليتين بأعلى الكود ببيانات مشروعك في Supabase (من Project Settings → API):</p>
        <code>const SUPABASE_URL = 'https://xxxx.supabase.co';<br>const SUPABASE_ANON_KEY = 'eyJhbGciOi...';</code>
        <p>بعد الحفظ، أعد فتح الصفحة.</p>
      </div>
    </div>`;
}

async function init(){
  if(!isConfigured()){ renderSetupScreen(); return; }

  if(!sb){
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    sb.auth.onAuthStateChange((event)=>{
      if(event === 'PASSWORD_RECOVERY'){
        renderSetNewPasswordScreen();
      }
    });
  }

  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    renderLoginScreen();
    return;
  }

  const ok = await loadCurrentUser(session.user.email);
  if(!ok){
    renderLoginScreen('هذا الحساب غير مسجّل بقائمة أعضاء الوحدة. تواصل مع مشرف النظام.');
    await sb.auth.signOut();
    return;
  }

  const { data: departments } = await sb.from('departments').select('*').order('name');
  state.departments = departments || [];

  renderShell();
  await loadAll();
  startInactivityWatcher();
}

async function loadCurrentUser(email){
  const { data, error } = await sb.from('app_users').select('*').eq('email', email).maybeSingle();
  if(error || !data) return false;
  state.currentUser = data;
  return true;
}

function renderLoginScreen(errorMsg){
  document.getElementById('app').innerHTML = `
    <div class="page">
      <div class="setup-screen login-screen">
        <img src="${LOGO_DATA_URI}" class="login-logo" alt="شعار جامعة القصيم - كلية الشريعة">
        <h2>تسجيل الدخول</h2>
        <p class="login-unit-name">وحدة المتابعة الإدارية</p>
        ${errorMsg ? `<p class="login-error">${escapeHtml(errorMsg)}</p>` : ''}
        <form id="loginForm" autocomplete="on">
          <div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" name="email" type="email" autocomplete="username"></div>
          <div class="field"><label>كلمة المرور</label><input id="loginPassword" name="password" type="password" autocomplete="current-password"></div>
          <button type="submit" class="btn-primary login-btn" id="loginBtn">تسجيل الدخول</button>
        </form>
        <button class="btn-text forgot-link" id="forgotBtn">نسيت كلمة المرور؟</button>
        <p class="login-error hidden" id="loginErr"></p>
      </div>
    </div>`;

  const doLogin = async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginErr');
    errEl.classList.add('hidden');
    if(!email || !password) return;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      errEl.textContent = 'بيانات الدخول غير صحيحة. تأكد من الإيميل وكلمة المرور.';
      errEl.classList.remove('hidden');
      return;
    }
    await init();
  };

  document.getElementById('loginForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    doLogin();
  });

  ['loginEmail','loginPassword'].forEach(id=>{
    document.getElementById(id).addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        doLogin();
      }
    });
  });

  document.getElementById('forgotBtn').onclick = ()=>{
    const errEl = document.getElementById('loginErr');
    errEl.innerHTML = 'نسيت كلمة المرور؟ راسل مشرف النظام على: <a href="mailto:o.aldukhail@qu.edu.sa">o.aldukhail@qu.edu.sa</a>';
    errEl.classList.remove('hidden');
  };
}

function renderForgotPasswordScreen(){
  document.getElementById('app').innerHTML = `
    <div class="page">
      <div class="setup-screen login-screen">
        <img src="${LOGO_DATA_URI}" class="login-logo" alt="شعار جامعة القصيم - كلية الشريعة">

        <p style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;">حط إيميلك المسجّل بالنظام، وبنرسل لك رابط لتعيين كلمة مرور جديدة.</p>
        <div class="field"><label>البريد الإلكتروني</label><input id="forgotEmail" type="email"></div>
        <button class="btn-primary login-btn" id="forgotSendBtn">إرسال رابط الاستعادة</button>
        <button class="btn-text forgot-link" id="backToLoginBtn">رجوع لتسجيل الدخول</button>
        <p class="login-error hidden" id="forgotErr"></p>
        <p class="login-success hidden" id="forgotOk"></p>
      </div>
    </div>`;

  document.getElementById('backToLoginBtn').onclick = ()=>renderLoginScreen();

  document.getElementById('forgotSendBtn').onclick = async ()=>{
    const email = document.getElementById('forgotEmail').value.trim();
    const errEl = document.getElementById('forgotErr');
    const okEl = document.getElementById('forgotOk');
    errEl.classList.add('hidden');
    okEl.classList.add('hidden');
    if(!email) return;

    const redirectUrl = location.origin + location.pathname;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl });
    if(error){
      errEl.textContent = 'حدث خطأ، تأكد من صحة الإيميل وحاول مرة أخرى.';
      errEl.classList.remove('hidden');
      return;
    }
    okEl.textContent = 'تم إرسال رابط الاستعادة إلى إيميلك (تحقق من صندوق الوارد ومجلد الرسائل غير المرغوبة).';
    okEl.classList.remove('hidden');
  };
}

    const errEl = document.getElementById('newPassErr');
    errEl.classList.add('hidden');
    if(!p1 || p1.length < 6){
      errEl.textContent = 'كلمة المرور لازم تكون 6 أحرف على الأقل.';
      errEl.classList.remove('hidden');
      return;
    }
    if(p1 !== p2){
      errEl.textContent = 'كلمتا المرور غير متطابقتين.';
      errEl.classList.remove('hidden');
      return;
    }
    const { error } = await sb.auth.updateUser({ password: p1 });
    if(error){
      errEl.textContent = 'حدث خطأ أثناء الحفظ، حاول مرة أخرى أو اطلب رابط استعادة جديد.';
      errEl.classList.remove('hidden');
      return;
    }
    await init();
  };
}

async function logout(){
  clearTimeout(inactivityTimer);
  await sb.auth.signOut();
  state.currentUser = null;
  renderLoginScreen();
}

function resetInactivityTimer(){
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(async ()=>{
    clearTimeout(inactivityTimer);
    await sb.auth.signOut();
    state.currentUser = null;
    renderLoginScreen('انتهت الجلسة بسبب عدم النشاط لمدة 30 دقيقة. سجّل الدخول من جديد.');
  }, INACTIVITY_LIMIT_MS);
}

function startInactivityWatcher(){
  if(inactivityWatcherStarted) { resetInactivityTimer(); return; }
  inactivityWatcherStarted = true;
  ['click','keydown','mousemove','scroll','touchstart'].forEach(evt=>{
    document.addEventListener(evt, resetInactivityTimer);
  });
  resetInactivityTimer();
}

async function loadAll(){
  const [{data:tasks}, {data:decisions}, {data:departments}, {data:weeklyReports}] = await Promise.all([
    sb.from('tasks').select('*').order('due_date', {ascending:true, nullsFirst:false}),
    sb.from('decisions').select('*').eq('status','active').order('decision_date', {ascending:false}),
    sb.from('departments').select('*').order('name'),
    sb.from('weekly_reports').select('*').order('week_start', {ascending:false})
  ]);
  state.tasks = tasks || [];
  state.decisions = decisions || [];
  state.departments = departments || [];
  state.weeklyReports = weeklyReports || [];
  flagOverdueLocally();
  renderStats();
  renderTasks();
  renderCompletedTasks();
  renderDecisions();
  renderDeptFilter();
  renderWeeklyPanel();
  renderDeptChart();
}

function flagOverdueLocally(){
  const today = new Date();
  state.tasks.forEach(t=>{
    if((t.status === 'جارية' || t.status === 'متأخرة') && t.due_date){
      const due = new Date(t.due_date);
      const daysPast = Math.floor((today - due) / (1000*60*60*24));
      if(daysPast > 3){
        t._displayStatus = 'متعثرة';
      } else if(daysPast > 0){
        t._displayStatus = 'متأخرة';
      } else {
        t._displayStatus = t.status;
      }
    } else {
      t._displayStatus = t.status;
    }
  });
}

function renderTasks(){
  const body = document.getElementById('tasksBody');
  const role = state.currentUser.role;
  const isFullEditor = EDITOR_ROLES.includes(role);
  const canEditRow = (t) => isFullEditor || (role === 'department' && t.department_id === state.currentUser.department_id);
  let list = state.tasks;
  if(state.filterStatus !== 'all'){
    list = list.filter(t=>t._displayStatus === state.filterStatus);
  } else {
    list = list.filter(t=>t._displayStatus !== 'منتهية');
  }
  if(state.filterDept !== 'all') list = list.filter(t=>t.department_id === state.filterDept);
  if(state.searchText) list = list.filter(t=>t.title.includes(state.searchText));

  if(list.length === 0){
    const msg = isFullEditor
      ? 'لا توجد مهام مطابقة — اضغط "+ مهمة جديدة" لإضافة أول مهمة.'
      : 'لا توجد مهام مسندة إليكم حاليًا.';
    body.innerHTML = `<tr class="empty-row"><td colspan="4">${msg}</td></tr>`;
    return;
  }

  body.innerHTML = list.map(t=>{
    const canEdit = canEditRow(t);
    const decTitle = decisionTitle(t.linked_decision_id);
    return `
    <tr class="row-${statusSlug(t._displayStatus)}">
      <td>
        <div class="task-title">${escapeHtml(t.title)}</div>
        ${t.notes ? `<div class="task-meta">${escapeHtml(t.notes)}</div>` : ''}
        ${decTitle ? `<div class="task-link">🔗 مرتبطة بقرار: ${escapeHtml(decTitle)}</div>` : ''}
        <div class="task-attach">
          ${t.attachment_path ? `<a href="#" id="task-attach-${t.id}" class="attach-link">📎 ${escapeHtml(t.attachment_name || 'تحميل المرفق')}</a>` : ''}
          ${canEdit ? `
            <label class="task-attach-upload">
              ${t.attachment_path ? '📎 استبدال الملف' : '📎 إرفاق ملف'}
              <input type="file" class="task-file-input hidden" data-id="${t.id}" data-dept="${t.department_id || ''}">
            </label>` : ''}
          ${role === 'department' && canEdit && t.attachment_path && t.status !== 'قيد المراجعة' && t.status !== 'منتهية'
            ? `<button class="submit-approval-btn" data-id="${t.id}">📤 إرسال للاعتماد</button>` : ''}
          ${isFullEditor && t.status === 'قيد المراجعة'
            ? `<button class="approve-btn" data-id="${t.id}">✅ اعتماد كمنتهية</button>` : ''}
        </div>
        ${isFullEditor ? `<button class="edit-task-btn" data-id="${t.id}">✏️ تعديل</button>` : ''}
      </td>
      <td>${escapeHtml(deptName(t.department_id))}</td>
      <td><span class="date-range">${t.start_date ? `<span>${t.start_date}</span><span class="date-arrow">←</span>` : ''}<span>${t.due_date || '—'}</span></span></td>
      <td>
        ${canEdit
          ? `<select class="status-select" data-id="${t.id}">
              ${STATUSES.filter(s => isFullEditor || s !== 'منتهية').map(s=>`<option value="${s}" ${t._displayStatus===s?'selected':''}>${s}</option>`).join('')}
            </select>`
          : `<span class="badge st-${statusSlug(t._displayStatus)}">${t._displayStatus}</span>`
        }
      </td>
    </tr>
  `;
  }).join('');

  body.querySelectorAll('.status-select').forEach(sel=>{
    sel.onchange = async (e)=>{
      const id = e.target.dataset.id;
      const newStatus = e.target.value;
      await sb.from('tasks').update({status:newStatus, last_update:new Date().toISOString()}).eq('id', id);
      await loadAll();
    };
  });

  body.querySelectorAll('.edit-task-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const task = state.tasks.find(t=>t.id === btn.dataset.id);
      if(task) openEditTaskModal(task);
    };
  });

  body.querySelectorAll('.task-file-input').forEach(input=>{
    input.onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const taskId = e.target.dataset.id;
      const deptId = e.target.dataset.dept || 'general';
      const path = `${deptId}/${Date.now()}_${sanitizeFileName(file.name)}`;
      const { error: uploadError } = await sb.storage.from('task-attachments').upload(path, file);
      if(uploadError){
        alert('حدث خطأ أثناء رفع الملف، حاول مرة أخرى.');
        return;
      }
      const updates = { attachment_path: path, attachment_name: file.name };
      const task = state.tasks.find(t=>t.id === taskId);
      if(task && task.status === 'قيد المراجعة') updates.status = 'جارية';
      await sb.from('tasks').update(updates).eq('id', taskId);
      await loadAll();
    };
  });

  body.querySelectorAll('.submit-approval-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      await sb.from('tasks').update({ status: 'قيد المراجعة' }).eq('id', btn.dataset.id);
      await loadAll();
    };
  });

  body.querySelectorAll('.approve-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      await sb.from('tasks').update({ status: 'منتهية', last_update: new Date().toISOString() }).eq('id', btn.dataset.id);
      await loadAll();
    };
  });

  attachTaskDownloadLinks();
}

async function attachTaskDownloadLinks(){
  const withAttachments = state.tasks.filter(t => t.attachment_path);
  for(const t of withAttachments){
    const el = document.getElementById(`task-attach-${t.id}`);
    if(!el) continue;
    const { data, error } = await sb.storage.from('task-attachments').createSignedUrl(t.attachment_path, 3600);
    if(!error && data){
      el.href = data.signedUrl;
      el.target = '_blank';
    }
  }
}

    </li>`;

function getWeekStartISO(d = new Date()){
  const day = d.getDay(); // 0 = الأحد
  const sunday = new Date(d);
  sunday.setDate(d.getDate() - day);
  return sunday.toISOString().slice(0,10);
}

function sanitizeFileName(name){
  const lastDot = name.lastIndexOf('.');
  const ext = lastDot > -1 ? name.slice(lastDot+1).replace(/[^a-zA-Z0-9]/g,'').slice(0,10) : '';
  const base = (lastDot > -1 ? name.slice(0, lastDot) : name)
    .replace(/[^a-zA-Z0-9_-]+/g, '_')
    .slice(0, 60) || 'file';
  return ext ? `${base}.${ext}` : base;
}

function renderDeptChart(){
  const panel = document.getElementById('deptChartPanel');
  const role = state.currentUser.role;

  if(role === 'department'){
    panel.classList.add('hidden');
    panel.innerHTML = '';
    return;
  }
  panel.classList.remove('hidden');

  const counts = state.departments.map(d => ({
    name: d.name,
    count: state.tasks.filter(t => t.department_id === d.id && t.status === 'منتهية').length
  }));
  const max = Math.max(1, ...counts.map(c => c.count));

  panel.innerHTML = `
    <div class="panel-head"><h2>المهام المنجزة حسب القسم</h2></div>
    <div class="dept-chart">
      ${counts.length === 0
        ? `<div class="empty-note">لا توجد أقسام مسجّلة بعد.</div>`
        : counts.map(c => `
          <div class="chart-row">
            <span class="chart-label">${escapeHtml(c.name)}</span>
            <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${(c.count/max*100).toFixed(1)}%"></div></div>
            <span class="chart-value">${c.count}</span>
          </div>`).join('')
      }
    </div>
  `;
}

  if(role === 'department'){
    const myReports = state.weeklyReports.filter(r => r.department_id === state.currentUser.department_id);

      <ul class="report-list">
        ${myReports.length === 0
          ? `<li class="empty-note">لا توجد تقارير سابقة مرسلة.</li>`
          : myReports.map(r => `
            <li>
              <div class="report-meta">الفترة: ${r.week_start} إلى ${r.week_end || r.week_start} — أُرسل بتاريخ ${new Date(r.submitted_at).toLocaleDateString('ar-SA')}
                <span class="badge-inline ${r.status === 'معتمد' ? 'badge-approved' : 'badge-pending'}">${r.status === 'معتمد' ? '✅ معتمد' : '📋 قيد المراجعة'}</span>
              </div>
              <div class="report-content">${escapeHtml(r.content || '')}</div>
              ${r.attachment_path ? `<a href="#" id="attach-${r.id}" class="attach-link">📎 ${escapeHtml(r.attachment_name || 'تحميل المرفق')}</a>` : ''}
            </li>`).join('')
        }
      </ul>
    `;

    document.getElementById('submitWeeklyBtn').onclick = async ()=>{
      const content = document.getElementById('weeklyContent').value.trim();
      const fileInput = document.getElementById('weeklyFile');
      const startDate = document.getElementById('weeklyStart').value;
      const endDate = document.getElementById('weeklyEnd').value;
      if(!content || !startDate || !endDate) return;
      if(endDate < startDate){
        alert('تاريخ النهاية لازم يكون بعد أو نفس تاريخ البداية.');
        return;
      }

      let attachmentPath = null;
      let attachmentName = null;
      if(fileInput.files.length > 0){
        const file = fileInput.files[0];
        const path = `${state.currentUser.department_id}/${Date.now()}_${sanitizeFileName(file.name)}`;
        const { error: uploadError } = await sb.storage.from('weekly-attachments').upload(path, file);
        if(!uploadError){ attachmentPath = path; attachmentName = file.name; }
      }

      await sb.from('weekly_reports').insert({
        department_id: state.currentUser.department_id,
        week_start: startDate,
        week_end: endDate,
        content,
        attachment_path: attachmentPath,
        attachment_name: attachmentName
      });
      await loadAll();
    };

  } else {
    // العميد / الأمين / الأدمن / الأعضاء: عرض التقارير المعلّقة فقط، والمعتمدة تنتقل لقسم منفصل
    const pending = state.weeklyReports.filter(r => r.status !== 'معتمد');
    panel.innerHTML = `
      <div class="panel-head"><h2>التقارير الأسبوعية للأقسام (بانتظار الاعتماد)</h2></div>
      <ul class="report-list">
        ${pending.length === 0
          ? `<li class="empty-note">لا توجد تقارير بانتظار الاعتماد حاليًا.</li>`
          : pending.map(r => `
            <li>
              <div class="report-meta">
                <span class="report-dept">${escapeHtml(deptName(r.department_id))}</span>
                — الفترة: ${r.week_start} إلى ${r.week_end || r.week_start} — أُرسل بتاريخ ${new Date(r.submitted_at).toLocaleDateString('ar-SA')}
              </div>
              <div class="report-content">${escapeHtml(r.content || '')}</div>
              ${r.attachment_path ? `<a href="#" id="attach-${r.id}" class="attach-link">📎 ${escapeHtml(r.attachment_name || 'تحميل المرفق')}</a>` : ''}
              ${isFullEditor ? `<button class="approve-report-btn" data-id="${r.id}">✅ اعتماد التقرير</button>` : ''}
            </li>`).join('')
        }
      </ul>
    `;

    if(isFullEditor){
      panel.querySelectorAll('.approve-report-btn').forEach(btn=>{
        btn.onclick = async ()=>{
          await sb.from('weekly_reports').update({ status: 'معتمد', approved_at: new Date().toISOString() }).eq('id', btn.dataset.id);
          await loadAll();
        };
      });
    }
  }

  attachDownloadLinks();
  renderApprovedReports();
}

function renderApprovedReports(){
  const panel = document.getElementById('approvedReportsPanel');
  const role = state.currentUser.role;
  if(role === 'department'){ panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');

  const approved = state.weeklyReports.filter(r => r.status === 'معتمد');
  panel.innerHTML = `
    <summary>📄 التقارير المعتمدة (${approved.length})</summary>
    <ul class="report-list">
      ${approved.length === 0
        ? `<li class="empty-note">لا توجد تقارير معتمدة بعد.</li>`
        : approved.map(r => `
          <li>
            <div class="report-meta">
              <span class="report-dept">${escapeHtml(deptName(r.department_id))}</span>
              — الفترة: ${r.week_start} إلى ${r.week_end || r.week_start}
            </div>
            <div class="report-content">${escapeHtml(r.content || '')}</div>
            ${r.attachment_path ? `<a href="#" id="approved-attach-${r.id}" class="attach-link">📎 ${escapeHtml(r.attachment_name || 'تحميل المرفق')}</a>` : ''}
          </li>`).join('')
      }
    </ul>
  `;

  approved.filter(r => r.attachment_path).forEach(async (r)=>{
    const el = document.getElementById(`approved-attach-${r.id}`);
    if(!el) return;
    const { data, error } = await sb.storage.from('weekly-attachments').createSignedUrl(r.attachment_path, 3600);
    if(!error && data){ el.href = data.signedUrl; el.target = '_blank'; }
  });
}

async function attachDownloadLinks(){
  const withAttachments = state.weeklyReports.filter(r => r.attachment_path);
  for(const r of withAttachments){
    const el = document.getElementById(`attach-${r.id}`);
    if(!el) continue;
    const { data, error } = await sb.storage.from('weekly-attachments').createSignedUrl(r.attachment_path, 3600);
    if(!error && data){
      el.href = data.signedUrl;
      el.target = '_blank';
    }
  }
}


function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

/* ===== النوافذ المنبثقة ===== */
function closeModal(){ document.getElementById('modalOverlay').classList.add('hidden'); document.getElementById('modalOverlay').innerHTML=''; }

function openEditTaskModal(task){
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="modal">
      <h3>تعديل المهمة</h3>
      <div class="field"><label>عنوان المهمة</label><input id="eTitle" type="text" value="${escapeHtml(task.title)}"></div>
      <div class="field"><label>القسم</label>
        <select id="eDept"><option value="">— بدون —</option>${state.departments.map(d=>`<option value="${d.id}" ${task.department_id===d.id?'selected':''}>${d.name}</option>`).join('')}</select>
      </div>
      <div class="field"><label>القرار المرتبط (اختياري)</label>
        <select id="eDecision"><option value="">— بدون —</option>${state.decisions.map(d=>`<option value="${d.id}" ${task.linked_decision_id===d.id?'selected':''}>${escapeHtml(d.title)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>تاريخ البداية</label><input id="eStart" type="date" value="${task.start_date || ''}"></div>
      <div class="field"><label>تاريخ النهاية</label><input id="eDue" type="date" value="${task.due_date || ''}"></div>
      <div class="field"><label>ملاحظات</label><textarea id="eNotes">${escapeHtml(task.notes || '')}</textarea></div>
      <p class="login-error hidden" id="eErr"></p>
      <div class="modal-actions">
        <button class="btn-danger" id="eDelete">🗑 حذف المهمة</button>
        <button class="btn-ghost" id="eCancel">إلغاء</button>
        <button class="btn-primary" id="eSave">حفظ التعديلات</button>
      </div>
    </div>`;
  document.getElementById('eCancel').onclick = closeModal;
  document.getElementById('eDelete').onclick = async ()=>{
    if(!confirm(`متأكد إنك تبي تحذف مهمة "${task.title}"؟ هذا الإجراء لا يمكن التراجع عنه.`)) return;
    await sb.from('tasks').delete().eq('id', task.id);
    closeModal();
    await loadAll();
  };
  document.getElementById('eSave').onclick = async ()=>{
    const title = document.getElementById('eTitle').value.trim();
    const startDate = document.getElementById('eStart').value || null;
    const dueDate = document.getElementById('eDue').value || null;
    const errEl = document.getElementById('eErr');
    errEl.classList.add('hidden');
    if(!title) return;
    if(startDate && dueDate && dueDate < startDate){
      errEl.textContent = 'تاريخ النهاية لازم يكون بعد أو نفس تاريخ البداية.';
      errEl.classList.remove('hidden');
      return;
    }
    const { error } = await sb.from('tasks').update({
      title,
      department_id: document.getElementById('eDept').value || null,
      linked_decision_id: document.getElementById('eDecision').value || null,
      start_date: startDate,
      due_date: dueDate,
      notes: document.getElementById('eNotes').value || null
    }).eq('id', task.id);
    if(error){
      errEl.textContent = 'حدث خطأ أثناء الحفظ، حاول مرة أخرى.';
      errEl.classList.remove('hidden');
      return;
    }
    closeModal();
    await loadAll();
  };
}

function openGenerateReportModal(){
  const today = new Date().toISOString().slice(0,10);
  const monthAgo = (()=>{ const d=new Date(); d.setDate(d.getDate()-30); return d.toISOString().slice(0,10); })();
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="modal">
      <h3>إصدار تقرير الفترة</h3>
      <div class="field"><label>من تاريخ</label><input id="repStart" type="date" value="${monthAgo}"></div>
      <div class="field"><label>إلى تاريخ</label><input id="repEnd" type="date" value="${today}"></div>
      <div class="modal-actions">
        <button class="btn-ghost" id="repCancel">إلغاء</button>
        <button class="btn-primary" id="repGenerate">إصدار التقرير</button>
      </div>
    </div>`;
  document.getElementById('repCancel').onclick = closeModal;
  document.getElementById('repGenerate').onclick = ()=>{
    const start = document.getElementById('repStart').value;
    const end = document.getElementById('repEnd').value;
    if(!start || !end || end < start){
      alert('تأكد من اختيار تاريخ بداية ونهاية صحيحين.');
      return;
    }
    generatePeriodReport(start, end);
    closeModal();
  };
}

function generatePeriodReport(start, end){
  const inRange = (dateStr) => dateStr && dateStr.slice(0,10) >= start && dateStr.slice(0,10) <= end;

  const completedTasks = state.tasks.filter(t => t.status === 'منتهية' && inRange(t.last_update));
  const approvedReports = state.weeklyReports.filter(r => r.status === 'معتمد' && inRange(r.approved_at));

  const tasksByDept = {};
  completedTasks.forEach(t=>{
    const key = deptName(t.department_id);
    tasksByDept[key] = (tasksByDept[key] || 0) + 1;
  });

  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('ar-SA') : '—';

  const html = `
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تقرير الفترة — وحدة المتابعة الإدارية</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2321; --ink-soft:#4A524E; --paper:#EEEEE5; --line:#D7D3C5;
    --seal-dark:#12294F; --teal:#1C9E93; --teal-tint:#DEF3F1;
    --amber:#9C6B1E; --amber-tint:#F1E7D3; --green:#2D6A4C; --green-tint:#DEEAE2;
  }
  *{box-sizing:border-box;}
  body{font-family:'IBM Plex Sans Arabic',sans-serif;color:var(--ink);margin:0;padding:32px;background:#fff;}
  h1,h2,h3{font-family:'Noto Kufi Arabic',sans-serif;margin:0;}
  .report-header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--teal);padding-bottom:16px;margin-bottom:20px;}
  .report-header img{height:56px;}
  .report-header h1{font-size:22px;color:var(--seal-dark);}
  .report-sub{color:var(--ink-soft);font-size:13px;margin-top:4px;}
  .period-badge{background:var(--teal-tint);color:var(--seal-dark);padding:6px 16px;border-radius:4px;font-weight:700;font-size:13px;}
  .summary-strip{display:flex;gap:14px;margin-bottom:24px;}
  .summary-box{flex:1;border:1px solid var(--line);border-radius:4px;padding:16px;text-align:center;}
  .summary-box .num{font-family:'Noto Kufi Arabic',sans-serif;font-size:30px;font-weight:700;color:var(--seal-dark);}
  .summary-box .lbl{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  section{margin-bottom:28px;}
  section h2{font-size:16px;color:var(--seal-dark);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{background:var(--paper);text-align:right;padding:8px 10px;font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--line);}
  td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  .dept-breakdown{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .dept-chip{background:var(--green-tint);color:var(--green);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;}
  .empty-note{color:var(--ink-soft);font-size:13px;text-align:center;padding:16px;}
  .report-footer{margin-top:32px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-soft);display:flex;justify-content:space-between;}
  .print-bar{text-align:left;margin-bottom:16px;}
  .print-bar button{
    background:var(--seal-dark);color:#fff;border:none;padding:9px 18px;border-radius:4px;
    font-family:'IBM Plex Sans Arabic',sans-serif;font-size:13px;font-weight:600;cursor:pointer;
  }
  @media print{ .print-bar{display:none;} body{padding:0;} }
</style>
</head>
<body>
  <div class="print-bar"><button onclick="window.print()">🖨 طباعة / حفظ PDF</button></div>

  <div class="report-header">
    <div>
      <h1>تقرير أداء وحدة المتابعة الإدارية</h1>
      <div class="report-sub">كلية الشريعة — جامعة القصيم</div>
    </div>
    <img src="${LOGO_DATA_URI}" alt="شعار الكلية">
  </div>

  <div style="margin-bottom:20px;">
    <span class="period-badge">الفترة: ${start} ← ${end}</span>
  </div>

  <div class="summary-strip">
    <div class="summary-box"><div class="num">${completedTasks.length}</div><div class="lbl">مهمة منجزة</div></div>
    <div class="summary-box"><div class="num">${approvedReports.length}</div><div class="lbl">تقرير أسبوعي معتمد</div></div>
    <div class="summary-box"><div class="num">${Object.keys(tasksByDept).length}</div><div class="lbl">قسم مشارك بالإنجاز</div></div>
  </div>

  <section>
    <h2>توزيع المهام المنجزة حسب القسم</h2>
    <div class="dept-breakdown">
      ${Object.keys(tasksByDept).length === 0
        ? `<div class="empty-note">لا توجد مهام منجزة خلال هذه الفترة.</div>`
        : Object.entries(tasksByDept).map(([name,count])=>`<span class="dept-chip">${name}: ${count}</span>`).join('')
      }
    </div>
  </section>

  <section>
    <h2>تفصيل المهام المنجزة (${completedTasks.length})</h2>
    ${completedTasks.length === 0 ? `<div class="empty-note">لا توجد مهام منجزة خلال هذه الفترة.</div>` : `
    <table>
      <thead><tr><th>المهمة</th><th>القسم</th><th>الفترة</th><th>تاريخ الإنجاز</th></tr></thead>
      <tbody>
        ${completedTasks.map(t=>`
          <tr>
            <td>${escapeHtml(t.title)}</td>
            <td>${escapeHtml(deptName(t.department_id))}</td>
            <td>${t.start_date || '—'} ← ${t.due_date || '—'}</td>
            <td>${fmtDate(t.last_update)}</td>
          </tr>`).join('')}
      </tbody>
    </table>`}
  </section>

  <section>
    <h2>تفصيل التقارير الأسبوعية المعتمدة (${approvedReports.length})</h2>
    ${approvedReports.length === 0 ? `<div class="empty-note">لا توجد تقارير معتمدة خلال هذه الفترة.</div>` : `
    <table>
      <thead><tr><th>القسم</th><th>الفترة</th><th>ملخص المحتوى</th><th>تاريخ الاعتماد</th></tr></thead>
      <tbody>
        ${approvedReports.map(r=>`
          <tr>
            <td>${escapeHtml(deptName(r.department_id))}</td>
            <td>${r.week_start} ← ${r.week_end || r.week_start}</td>
            <td>${escapeHtml((r.content || '').slice(0,120))}${(r.content||'').length>120?'...':''}</td>
            <td>${fmtDate(r.approved_at)}</td>
          </tr>`).join('')}
      </tbody>
    </table>`}
  </section>

  <div class="report-footer">
    <span>أُصدر بواسطة: ${escapeHtml(state.currentUser.full_name)}</span>
    <span>تاريخ الإصدار: ${new Date().toLocaleDateString('ar-SA')}</span>
  </div>
</body>
</html>`;

  const w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
}

init();
</script>
</body>
</html>
