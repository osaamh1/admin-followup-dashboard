name: Keep Supabase alive

# يرسل طلب قراءة بسيطًا لقاعدة البيانات مرتين في الأسبوع حتى لا يُوقف Supabase المشروع
# (المشاريع المجانية تُوقف بعد 7 أيام بلا نشاط). المفتاح هنا هو المفتاح العام (anon) نفسه الموجود في index.html.
on:
  schedule:
    - cron: '0 6 * * 1,4'   # الإثنين والخميس 6:00 UTC (9:00 صباحًا بتوقيت السعودية)
  workflow_dispatch: {}      # لتشغيله يدويًا من تبويب Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://aatofmnhbolpyhhuhtnu.supabase.co/rest/v1/departments?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhdG9mbW5oYm9scHloaHVodG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMzM3OTksImV4cCI6MjEwNDYwOTc5OX0.WLOpuM1eWmGTB32-kKtjvr-c63vUABz0PTgoFik5V2A" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhdG9mbW5oYm9scHloaHVodG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMzM3OTksImV4cCI6MjEwNDYwOTc5OX0.WLOpuM1eWmGTB32-kKtjvr-c63vUABz0PTgoFik5V2A")
          echo "HTTP status: $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Supabase did not answer as expected"; exit 1
          fi
